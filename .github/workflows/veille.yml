name: Veille IA hebdomadaire

# Veille LLM/IA hebdomadaire postée sur Teams (voir README).
on:
  schedule:
    # Tous les lundis à 07:00 UTC (~09:00 Paris été / 08:00 hiver).
    - cron: "0 7 * * 1"
  # Permet un déclenchement manuel depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run veille
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          MODEL_ID: ${{ vars.MODEL_ID || 'anthropic/claude-sonnet-5' }}
          AGENT_MAX_STEPS: ${{ vars.AGENT_MAX_STEPS || '12' }}
        run: python main.py
